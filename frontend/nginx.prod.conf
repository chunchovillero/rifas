server {
  listen 80; server_name _; client_max_body_size 20m;
  gzip on; gzip_vary on; gzip_min_length 1024; gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  root /usr/share/nginx/html; index index.html;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  location /static/ { alias /srv/static/; expires 7d; }
  location /media/ { alias /srv/media/; expires 1d; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location /brand/ { try_files $uri =404; expires 30d; }
  location = /robots.txt { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  location = /sitemap.xml { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  location ~ ^/rifas/[^/]+/?$ { proxy_pass http://backend:8000/seo$uri; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  location ~ ^/(|planes/?|ayuda/pro/?|privacidad/?|terminos/?|ingresar/?|registro/?|perfil/?|panel/?|nueva/?|reserva/?|administracion(?:/.*)?|panel/rifas/[^/]+/?|reserva/[^/]+/?|rifas/[^/]+/editar/?)$ { try_files /index.html =404; }
  location / { try_files $uri $uri/ =404; }
}
